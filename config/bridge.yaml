# Raw gz-sim raycast cloud of the Livox HAP sensor (the resampled
# Livox-pattern cloud is published directly by the livox plugin on
# /livox/lidar/pointcloud2, no bridge needed for it).
- ros_topic_name: "livox_hap_points"
  gz_topic_name: "/livox_hap/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

# --- ZED2i stereo camera (native gz-sim sensors, urdf/zed2i_camera.xacro) ---
# Each camera publishes its image on /zed2/<cam>/image (gz.msgs.Image) and
# its intrinsics on /zed2/<cam>/camera_info (gz.msgs.CameraInfo). The depth
# camera also publishes a point cloud on /zed2/depth/image/points
# (gz.msgs.PointCloudPacked). ROS names follow the ZED / classic-plugin
# conventions.

- ros_topic_name: "zed2/left_raw/image_raw_color"
  gz_topic_name: "/zed2/left_raw/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "zed2/left_raw/camera_info"
  gz_topic_name: "/zed2/left_raw/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

- ros_topic_name: "zed2/right_raw/image_raw_color"
  gz_topic_name: "/zed2/right_raw/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "zed2/right_raw/camera_info"
  gz_topic_name: "/zed2/right_raw/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

- ros_topic_name: "zed2/right/image_rect_color"
  gz_topic_name: "/zed2/right/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "zed2/right/camera_info"
  gz_topic_name: "/zed2/right/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

- ros_topic_name: "zed2/depth/depth_registered"
  gz_topic_name: "/zed2/depth/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "zed2/depth/camera_info"
  gz_topic_name: "/zed2/depth/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

- ros_topic_name: "zed2/point_cloud/cloud_registered"
  gz_topic_name: "/zed2/depth/image/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

- ros_topic_name: "zed2/imu"
  gz_topic_name: "/zed2/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS
