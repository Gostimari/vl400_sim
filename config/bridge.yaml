# ros_gz_bridge configuration for the tractor simulation.
# direction: GZ_TO_ROS, ROS_TO_GZ or BIDIRECTIONAL

- ros_topic_name: "cmd_vel"
  gz_topic_name: "/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "odom"
  gz_topic_name: "/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

- ros_topic_name: "joint_states"
  # gz-sim scopes the JointStatePublisher topic under the world and
  # model name: /world/<world>/model/<model>/joint_state. The default
  # launch uses world forest_ground-100-easy and spawns the robot as
  # model vl400 (change this if you launch a different world).
  gz_topic_name: "/world/forest_ground-100-easy/model/vl400/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

- ros_topic_name: "imu"
  gz_topic_name: "/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

- ros_topic_name: "fix"
  gz_topic_name: "/fix"
  ros_type_name: "sensor_msgs/msg/NavSatFix"
  gz_type_name: "gz.msgs.NavSat"
  direction: GZ_TO_ROS

- ros_topic_name: "mag"
  gz_topic_name: "/mag"
  ros_type_name: "sensor_msgs/msg/MagneticField"
  gz_type_name: "gz.msgs.Magnetometer"
  direction: GZ_TO_ROS

- ros_topic_name: "velodyne_points"
  gz_topic_name: "/velodyne/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

# - ros_topic_name: "velodyne_scan"
#   gz_topic_name: "/velodyne"
#   ros_type_name: "sensor_msgs/msg/LaserScan"
#   gz_type_name: "gz.msgs.LaserScan"
#   direction: GZ_TO_ROS

# Raw gz-sim raycast cloud of the Livox HAP sensor (the resampled
# Livox-pattern cloud is published directly by the livox plugin on
# /livox/lidar/pointcloud2, no bridge needed for it).
- ros_topic_name: "livox_hap_points"
  gz_topic_name: "/livox_hap/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS
